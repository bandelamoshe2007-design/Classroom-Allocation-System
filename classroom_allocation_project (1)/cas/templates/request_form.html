{% extends "base.html" %}{% block content %}
<h1>Request a Classroom</h1><p class="sub">The system checks capacity, facilities and clashes, then allocates the best-fit room automatically.</p>
<div class="card" style="max-width:720px"><form method="post">
<div class="row"><div><label>Course</label><select name="courseId" required>
{% for c in courses %}<option value="{{ c.courseId }}" {{ 'selected' if form.get('courseId')|string==c.courseId|string }}>{{ c.courseCode }} - {{ c.courseName }}</option>{% endfor %}</select></div>
<div><label>Date</label><input type="date" name="reqDate" id="d" min="{{ today }}" value="{{ form.get('reqDate','') }}" required onchange="f()"></div></div>
<div class="row"><div><label>Time slot (filtered by the weekday of the date)</label><select name="slotId" id="s" required>
{% for s in slots %}<option value="{{ s.slotId }}" data-day="{{ s.dayOfWeek }}" {{ 'selected' if form.get('slotId')|string==s.slotId|string }}>{{ s.dayOfWeek[:3] }} {{ s.startTime }}-{{ s.endTime }}</option>{% endfor %}</select></div>
<div><label>Class strength</label><input type="number" name="capacityNeeded" min="1" max="1000" value="{{ form.get('capacityNeeded','') }}" required></div></div>
<div class="row"><div><label>Room type</label><select name="roomType"><option value="Any">Any</option>{% for t in ROOM_TYPES %}<option {{ 'selected' if form.get('roomType')==t }}>{{ t }}</option>{% endfor %}</select></div></div>
<label class="chk"><input type="checkbox" name="needProjector" {{ 'checked' if form.get('needProjector') }}> Projector required</label>
<p style="margin-top:20px"><button class="btn g">Submit request</button> <a class="btn l" href="{{ url_for('availability') }}">Check availability first</a></p></form></div>
<script>
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function f(){var v=document.getElementById('d').value;if(!v)return;var day=DAYS[new Date(v+'T00:00:00').getDay()],s=document.getElementById('s'),first=null;
for(var o of s.options){var ok=o.dataset.day==day;o.hidden=!ok;o.disabled=!ok;if(ok&&!first)first=o}
if(!first){alert(day+' has no time slots (Sunday is a holiday).');}else if(s.selectedOptions[0].disabled){s.value=first.value}}
f();
</script>{% endblock %}
